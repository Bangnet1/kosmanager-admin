name: Generate npm lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/generate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-lockfile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies and create package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
          else
            git commit -m "Add reproducible npm dependency lockfile"
            git push
          fi
